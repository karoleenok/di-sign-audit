name: tiles-import
on:
  push:
    branches: [tiles-import]
    paths: [".github/scripts/tiles_import.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python .github/scripts/tiles_import.py
      - run: |
          git config user.name "tiles-import"
          git config user.email "tiles-import@users.noreply.github.com"
          git add bot/app/gallery
          git commit -m "Плитки теста: 24 современных постера, кадр 4:5" || exit 0
          git push
